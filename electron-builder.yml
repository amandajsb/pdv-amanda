appId: com.pdvamanda.app
productName: Sistema de Vendas
copyright: PDV-Amanda
extraMetadata:
  pdvDemonstracao: false

directories:
  output: dist
  buildResources: recursos

files:
  - src/**/*
  - package.json
  - '!**/*.map'

# O .node do better-sqlite3 não pode ficar dentro do asar: o processo precisa
# carregá-lo do disco.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

# O better-sqlite3 13 já traz prebuilds N-API por plataforma. Deixar o
# electron-builder recompilar exigiria Visual Studio Build Tools na máquina de
# quem gera o instalador, sem nenhum ganho.
npmRebuild: false

win:
  target:
    - nsis
  icon: recursos/icone.ico
  artifactName: ${productName} ${version} - instalador.${ext}

nsis:
  # Instalador com telas, não "um clique": a dona da loja precisa ver onde
  # está instalando e conseguir repetir o processo sozinha.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Sistema de Vendas
  runAfterFinish: true

  # 1046 = Português (Brasil). Sem isto o instalador sai em inglês.
  language: '1046'
  displayLanguageSelector: false

  # Identidade visual — geradas por recursos/gerar-assets.py.
  installerIcon: recursos/icone.ico
  uninstallerIcon: recursos/icone.ico
  installerHeaderIcon: recursos/icone.ico
  installerSidebar: recursos/installerSidebar.bmp
  uninstallerSidebar: recursos/uninstallerSidebar.bmp
  installerHeader: recursos/installerHeader.bmp

  # Nunca apagar o banco da loja ao desinstalar. O arquivo fica em
  # %APPDATA%\pdv-amanda\pdv.db e sobrevive a desinstalar e reinstalar.
  deleteAppDataOnUninstall: false
